<!DOCTYPE html>
<html>
<head>
  <title>Basic Snake HTML Game</title>
  <meta charset="UTF-8">

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h2 {
      color: white;
      margin: 0 0 10px;
      text-transform: uppercase;
    }

    #games-link {
      margin-bottom: 20px;
      color: #00aaff;
      text-decoration: none;
      text-transform: uppercase;
      font-weight: bold;
      transition: transform 0.2s, text-decoration 0.2s;
    }

    #games-link:hover {
      text-decoration: underline;
      transform: scale(1.2);
    }

    canvas {
      border: 1px solid white;
    }
  </style>
</head>

<body>

<div class="game-container">
  <h2>Snake:</h2>

  <a href="Games.html" id="games-link">Back to Games</a>

  <canvas width="640" height="480" id="game"></canvas>
</div>

</body>
</html>

<script>

    const gameover = new Audio('Music/Snake/GameOver.mp3');
var canvas = document.getElementById('game');
var context = canvas.getContext('2d');

// the canvas width & height, snake x & y, and the apple x & y, all need to be a multiples of the grid size in order for collision detection to work
// (e.g. 16 * 25 = 400)
var grid = 16;
var count = 0;

var snake = {
  x: 160,
  y: 160,

  // snake velocity. moves one grid length every frame in either the x or y direction
  dx: grid,
  dy: 0,

  // keep track of all grids the snake body occupies
  cells: [],

  // length of the snake. grows when eating an apple
  maxCells: 4
};
var apple = {
  x: 320,
  y: 320
};

var score = 0;
var gameOver = false;

// get random whole numbers in a specific range
// @see https://stackoverflow.com/a/1527820/2124254
function getRandomInt(min, max) {
  return Math.floor(Math.random() * (max - min)) + min;
}

function restartGame() {
  snake.x = 160;
  snake.y = 160;

  snake.cells = [];
  snake.maxCells = 4;

  snake.dx = grid;
  snake.dy = 0;

  score = 0;
  gameOver = false;

  apple.x = getRandomInt(0, 25) * grid;
  apple.y = getRandomInt(0, 25) * grid;
}

let gamespeed = 32

// game loop
function loop() {
  requestAnimationFrame(loop);

  // slow game loop to 15 fps instead of 60 (60/15 = 4)
  if (++count < gamespeed) {
    return;
  }

  count = 0;
  context.clearRect(0,0,canvas.width,canvas.height);

context.fillStyle = 'white';
context.font = '20px monospace';
context.textAlign = 'left';
context.fillText('Score: ' + score, 10, 25);

if (gameOver) {

  context.fillStyle = 'rgba(0,0,0,0.75)';
context.fillStyle = 'rgba(0,0,0,0.75)';
context.fillRect(0, canvas.height / 2 - 50, canvas.width, 100);

context.fillStyle = 'white';
context.font = '30px monospace';
context.textAlign = 'center';

context.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

context.font = '18px monospace';
context.fillText('Score: ' + score, canvas.width / 2, canvas.height / 2 + 20);
context.fillText('Press R to Restart', canvas.width / 2, canvas.height / 2 + 50);

  return;
}

let nextX = snake.x + snake.dx;
let nextY = snake.y + snake.dy;

// wall collision = game over
if (
  nextX < 0 ||
  nextX >= canvas.width ||
  nextY < 0 ||
  nextY >= canvas.height
) {
  gameOver = true;
  gameover.play();
  return;
}

snake.x = nextX;
snake.y = nextY;

  // keep track of where snake has been. front of the array is always the head
  snake.cells.unshift({x: snake.x, y: snake.y});

  // remove cells as we move away from them
  if (snake.cells.length > snake.maxCells) {
    snake.cells.pop();
  }

  // draw apple
  context.fillStyle = 'red';
  context.fillRect(apple.x, apple.y, grid-1, grid-1);

  // draw snake one cell at a time
  context.fillStyle = 'green';
  snake.cells.forEach(function(cell, index) {

    // drawing 1 px smaller than the grid creates a grid effect in the snake body so you can see how long it is
    context.fillRect(cell.x, cell.y, grid-1, grid-1);

    // snake ate apple
if (cell.x === apple.x && cell.y === apple.y) {
  snake.maxCells++;
  score += 10;
  gamespeed -= 1;

  apple.x = getRandomInt(0, 25) * grid;
  apple.y = getRandomInt(0, 25) * grid;
}

    // check collision with all cells after this one (modified bubble sort)
    for (var i = index + 1; i < snake.cells.length; i++) {

// snake occupies same space as a body part
if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
  gameOver = true;
  gameover.volume = 0.3;
  gameover.play();
}
    }
  });
}

// listen to keyboard events to move the snake
document.addEventListener('keydown', function(e) {

  if (gameOver) {

    if (e.key.toLowerCase() === 'r') {
      restartGame();
    }

    return;
  }

  // left arrow key
  if (e.which === 37 && snake.dx === 0) {
    snake.dx = -grid;
    snake.dy = 0;
  }
  // up arrow key
  else if (e.which === 38 && snake.dy === 0) {
    snake.dy = -grid;
    snake.dx = 0;
  }
  // right arrow key
  else if (e.which === 39 && snake.dx === 0) {
    snake.dx = grid;
    snake.dy = 0;
  }
  // down arrow key
  else if (e.which === 40 && snake.dy === 0) {
    snake.dy = grid;
    snake.dx = 0;
  }
});

// start the game
requestAnimationFrame(loop);

</script>
</body>
</ht
